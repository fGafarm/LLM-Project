  if(a>=1e8) return Math.round(v/1e8).toLocaleString()+'億円';
  if(a>=1e6) return Math.round(v/1e6).toLocaleString()+'百万円';
  return Math.round(v).toLocaleString()+'円'; }
const mil=(v)=>v==null?'—':yen(v*1e6);
const man=(v)=>v==null?'—':Math.round(v/1e4).toLocaleString()+'万円';

/* ---------- donut from segments ---------- */
function donut(segs){
  if(!segs||!segs.length) return '';
  const tot=segs.reduce((s,x)=>s+(x.revenueRaw||0),0)||1;
  const cols=['var(--navy)','var(--navy2)','var(--gold)','#B9C3D6','#8AA0C8','#D9C57A'];
  let acc=0,stops=[],legend='';
  segs.forEach((s,i)=>{const p=(s.revenueRaw||0)/tot*100;stops.push(`${cols[i%cols.length]} ${acc}% ${acc+p}%`);acc+=p;
    legend+=`<span class="legendDot" style="background:${cols[i%cols.length]}"></span>${s.name} ${p.toFixed(1)}%<br>`;});
  return `<div class="donutWrap"><div class="donut" style="background:conic-gradient(${stops.join(',')})"></div><div class="segList">${legend}</div></div>`;
}

/* ---------- bars (timeseries metric) ---------- */
function barChart(pairs,gold){ // pairs:[{x,v}]
  const vals=pairs.map(p=>p.v).filter(v=>v!=null);if(!vals.length)return '';
  const mn=Math.min(...vals,0),mx=Math.max(...vals);
  return `<div class="bars">${pairs.map((p,i)=>{const h=p.v==null?0:((p.v-mn)/((mx-mn)||1)*100);return `<div class="b ${i===pairs.length-1?'gold':''}" style="height:${h}%"><span>${p.lab??p.v}</span></div>`;}).join('')}</div>
  <div class="barX">${pairs.map(p=>`<div>${p.x}</div>`).join('')}</div>`;
}

/* ---------- 業績推移チャート(売上/営業利益/純利益) ---------- */
function perfCharts(){
  const rs=[...reports].sort((a,b)=>(a.year||0)-(b.year||0));
  const ch=(title,getter)=>{
    const pairs=rs.map(r=>{const v=getter(r);return {x:String(r.year).slice(2),v:(v==null?null:v),lab:(v==null?'':yen(v).replace('円',''))};});
    if(!pairs.some(p=>p.v!=null))return '';
    return `<div><div class="secNote" style="font-weight:700;margin-bottom:6px">${title}</div>${barChart(pairs)}</div>`;
  };
  const blocks=[ch('売上高',r=>r.financialStatements?.pl?.revenue),ch('営業利益',r=>r.financialStatements?.pl?.operatingIncome),ch('純利益',r=>r.financialStatements?.pl?.netIncome)].filter(Boolean);
  if(!blocks.length)return '';
  return `<div class="grid g3">${blocks.join('')}</div>`;
}

    決算書のB/Sに載る土地は<b>取得した当時の価格（簿価）</b>のまま計上され続けます。何十年も前に買った土地は、現在の時価と大きく離れていても簿価のまま——つまり<b>開示B/Sは資産価値を過小評価している</b>ことがあります。<br>
    本タブは、有報の土地情報に国交省の地価データ（公示地価L01・地価調査L02・取引価格・用途地域A29）を突き合わせて<b>推定時価</b>を算出し、簿価との差額＝<b>含み益（決算書に出てこない隠れ資産）</b>を可視化します。目的は「会社を解散したら実際にいくらの資産があるか＝<b>実態の解散価値</b>」を示すこと。<br>
    <b>${DATA.companyName}</b>の場合: 土地簿価 ${mil(book)} に対し推定時価 ${mil(s.totalLandMarketValueMil)}、差額 <b style="color:var(--navy)">${mil(sc.base)}</b> が決算書に現れていない土地の含み益です（簿価の${s.marketToBookMultiple||'—'}倍）。<br>
    <span class="secNote">下の3シナリオ = 地価のばらつきの下限(保守/P25)・中央(中立)・上限(強気/P75)。「前提の選択肢」として提示し、当サイトは判断しません。</span>
    </div></div>
    <div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px">
    <div><div class="eyebrow">TRUE BALANCE SHEET — 土地の簿価 vs 推定時価</div>
    <div class="secTitle">土地簿価 ${mil(book)} → 推定時価 <span id="navv"></span></div>
    <div class="secNote">含み益 <b id="gain" style="color:var(--navy);font-size:16px"></b>（市場価値 ÷ 簿価 = <b>${s.marketToBookMultiple||'—'}倍</b>、業界P95=${ha.industryP95||'—'}）</div></div>
    <div class="scenario" id="scnBtns"><button data-s="cons">保守</button><button data-s="base" class="on">中立</button><button data-s="full">強気</button></div></div>
    <div class="wfArea"><div class="wfCol"><div class="wfBar" id="b1" style="background:var(--navy2)"><div class="wfVal num">${mil(book)}</div></div></div>
    <div class="wfCol"><div class="wfBar float" id="b2" style="background:var(--green)"><div class="wfVal num pos" id="v2"></div></div></div>
    <div class="wfCol"><div class="wfBar" id="b3" style="background:var(--gold)"><div class="wfVal num" id="v3"></div></div></div></div>
    <div class="wfLabels"><div>土地簿価<br>(連結B/S)</div><div>含み益<br><span id="l2"></span></div><div><b>推定時価</b></div></div>
    <div class="secNote mt16" id="scnDesc"></div></div>`;
  // detail
  html+=`<div class="grid g2"><div class="card"><h4 class="inCard">サマリー（実データ）</h4><table class="data">
    <tr><th>項目</th><th class="r">値</th></tr>
    <tr><td>対象施設 / 価格付け済</td><td class="r num">${s.facilitiesTotal||'—'}件 / ${s.facilitiesWithPrice||'—'}件</td></tr>
    <tr><td>土地簿価</td><td class="r num">${mil(s.totalLandBookValueMil)}</td></tr>
    <tr><td>推定時価(中立)</td><td class="r num">${mil(s.totalLandMarketValueMil)}</td></tr>
    <tr><td>含み益(保守 P25)</td><td class="r num">${mil(sc.conservative)}</td></tr>
    <tr><td>含み益(中立)</td><td class="r num pos">+${mil(sc.base)}</td></tr>
    <tr><td>含み益(強気 P75)</td><td class="r num">${mil(sc.optimistic)}</td></tr>
    <tr><td>市場/簿価 倍率</td><td class="r num">${s.marketToBookMultiple||'—'}倍</td></tr>
    <tr><td>価格カバー率</td><td class="r num">${s.pricedCoverageRatio!=null?(s.pricedCoverageRatio*100).toFixed(1)+'%':'—'}</td></tr>
    </table>
    <div class="src mt16">取得時代: ${ha.acquisitionEra?.era==='prewar'?'戦前':ha.acquisitionEra?.era}(${ha.acquisitionEra?.effectiveYear}年) → 簿価は実勢より過小と推定。</div></div>
    <div class="card"><h4 class="inCard">含み益の大きい物件 TOP5（実データ）</h4><table class="data"><tr><th>物件</th><th class="r">含み益</th><th>用途/手法</th></tr>
    ${facs.slice(0,5).map(f=>`<tr><td>${f.name}<div class="secNote">${f.address||''}</div></td><td class="r num pos">${mil(f.hiddenGainMil)}</td><td><span class="pill">${f.useCategory||'—'}</span>${f.priceMethod?`<span class="pill">${f.priceMethod}</span>`:''}</td></tr>`).join('')}
    </table>
    <div class="footNote">⚠ 「開示PBR→実質PBR」の数値対比には時価総額(株数×株価)が必要で、現データに株価が無いため後でバックエンド補完予定。含み益・3シナリオ・物件明細は実データ。自社利用不動産の含みは時価開示対象外。</div></div></div>`;
  return html;
}
function setScn(key){
  SCN_KEY=key;const ha=DATA.hiddenAssets;const sc=ha.scenarios;const book=(ha.summary.totalLandBookValueMil)*1e6;
  const map={cons:sc.conservative*1e6,base:sc.base*1e6,full:sc.optimistic*1e6};
  const names={cons:'保守',base:'中立',full:'強気'};
  const descs={cons:'保守: 地価P25(下限)ベースの含み益。',base:'中立: 地価公示・取引価格の中央値ベースで推定。標準表示。',full:'強気: 地価P75(上限)ベースの含み益。'};
  const gainV=map[key];const mvV=book+gainV;const MAX=(book+sc.optimistic*1e6)*1.05,H=200,px=v=>Math.round(v/MAX*H);
  document.querySelectorAll('#scnBtns button').forEach(b=>b.classList.toggle('on',b.dataset.s===key));
  const b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3');
  if(!b1)return;
  b1.style.height=px(book)+'px';
  b2.style.height=px(gainV)+'px';b2.style.bottom=px(book)+'px';
  b3.style.height=px(mvV)+'px';
  document.getElementById('v2').textContent='+'+yen(gainV);
  document.getElementById('v3').textContent=yen(mvV);
  document.getElementById('navv').textContent=yen(mvV)+'（'+names[key]+'）';
  document.getElementById('gain').textContent='+'+yen(gainV);
  document.getElementById('l2').textContent=names[key]+': +'+yen(gainV);
  document.getElementById('scnDesc').textContent=descs[key];
}

/* ---------- SEGMENT ---------- */
function segTable(segs,title){if(!segs||!segs.length)return '';
  return `<div class="card"><h4 class="inCard">${title}</h4>${donut(segs)}<div style="overflow-x:auto" class="mt16"><table class="data"><tr><th>セグメント</th><th class="r">売上</th><th class="r">利益</th><th class="r">利益率</th></tr>${segs.map(s=>`<tr><td>${s.name}</td><td class="r num">${s.revenue||'—'}</td><td class="r num">${s.operatingProfit||'—'}</td><td class="r num">${s.profitMargin||'—'}</td></tr>`).join('')}</table></div></div>`;}
function tabSegment(){
  const r=rep();let html='';
  html+=segTable(r.segments,'事業セグメント');
  html+=segTable(r.geographicSegments,'地域別セグメント');
  // employees by segment (latest year)
  const ey=DATA.companyInfo?.employeesByYear?.[String(curYear)]||DATA.companyInfo?.employeesByYear?.[String(reports[0].year)];
  if(ey&&ey.segments){html+=`<div class="card"><h4 class="inCard">セグメント別 従業員数（${curYear}年度）— 「人をどこに投入しているか」</h4><table class="data"><tr><th>セグメント</th><th class="r">従業員数</th><th class="r">臨時</th></tr>${ey.segments.map(s=>`<tr><td>${s.name}</td><td class="r num">${ninzu(s.employeeCount)}</td><td class="r num">${s.tempCount!=null?ninzu(s.tempCount):'—'}</td></tr>`).join('')}</table></div>`;}
  // R&D / capex
  const ir=r.investmentRD;
  if(ir){html+=`<div class="card"><h4 class="inCard">設備投資・研究開発</h4><div class="grid g3"><div class="kpi"><div class="l">設備投資</div><div class="v">${ir.capexStr||mil(ir.capex/1e6)}</div></div><div class="kpi"><div class="l">研究開発費</div><div class="v">${ir.rdExpensesStr||'—'}</div></div><div class="kpi"><div class="l">減価償却費</div><div class="v">${ir.depreciationStr||'—'}</div></div></div></div>`;}
  return html||'<div class="card">セグメント開示なし</div>';
}

/* ---------- FINANCIAL (3 statements) ---------- */
function stmtTable(rows){if(!rows||!rows.length)return '<div class="secNote">明細なし</div>';
  return `<table class="data stmt">${rows.map(x=>`<tr class="${x.abstract?'ttl':''} ${x.total?'tot':''}"><td style="padding-left:${12+(x.depth||0)*16}px">${x.label}</td><td class="r num">${x.value!=null?yen(x.value):''}</td></tr>`).join('')}</table>`;}
function tabFinancial(){
  const r=rep();const ds=r.dynamicStatements;
  if(!ds)return '<div class="card">財務諸表データなし</div>';
  const pc=perfCharts();
  return `<div class="secNote" style="margin-bottom:12px">会計基準: ${ds.accountingStandard||'—'} ｜ ${r.year}年度 ｜ 単位は自動(兆/億円)。EDINET原文の階層をそのまま再現。</div>
  ${pc?`<div class="card"><h4 class="inCard">業績推移（売上高・営業利益・純利益）</h4>${pc}</div>`:''}
  <div class="grid g2">
    <div class="card"><h4 class="inCard">損益計算書 (P/L)</h4><div style="overflow-x:auto">${stmtTable(ds.pl)}</div></div>
    <div class="card"><h4 class="inCard">キャッシュ・フロー計算書 (C/F)</h4><div style="overflow-x:auto">${stmtTable(ds.cf)}</div></div>
  </div>
  <div class="card"><h4 class="inCard">貸借対照表 (B/S)</h4><div style="overflow-x:auto">${stmtTable(ds.bs)}</div></div>`;
}

/* ---------- SALARY & PEOPLE ---------- */
function tabSalary(){
  const ci=DATA.companyInfo;const eby=ci.employeesByYear||{};
  const yrs=Object.keys(eby).sort();const latest=eby[yrs[yrs.length-1]]||{};
  let html=`<div class="card"><div class="eyebrow">SALARY & PEOPLE — 有報「従業員の状況」</div>
    <div style="display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap">
      <div><div class="bigNum num" style="color:var(--navy)">${latest.avgAnnualSalary?man(latest.avgAnnualSalary):'—'}</div><div class="secNote">平均年間給与（${yrs[yrs.length-1]}年度・提出会社）</div></div>
      <div style="padding-bottom:6px;font-size:13px">平均年齢 <b>${latest.avgAge??'—'}歳</b> / 平均勤続 <b>${latest.avgTenureYears??'—'}年</b><br>従業員 <b>${ninzu(latest.employeeCount)}</b>（臨時 ${ninzu(latest.tempEmployeeCount)}）</div>
    </div></div>`;
  // salary 10yr bar
  const pairs=yrs.map(y=>({x:y.slice(2),v:eby[y].avgAnnualSalary?Math.round(eby[y].avgAnnualSalary/1e4):null,lab:eby[y].avgAnnualSalary?Math.round(eby[y].avgAnnualSalary/1e4):''}));
  html+=`<div class="card"><h4 class="inCard">平均年収の推移（万円）</h4>${barChart(pairs)}</div>`;
  // employee history table
  html+=`<div class="card"><h4 class="inCard">従業員数・年収・勤続の推移</h4><div style="overflow-x:auto"><table class="data"><tr><th>年度</th><th class="r">従業員数</th><th class="r">平均年齢</th><th class="r">平均勤続</th><th class="r">平均年収</th></tr>${yrs.slice().reverse().map(y=>{const e=eby[y];return `<tr><td>${y}年度</td><td class="r num">${ninzu(e.employeeCount)}</td><td class="r num">${e.avgAge??'—'}歳</td><td class="r num">${e.avgTenureYears??'—'}年</td><td class="r num">${e.avgAnnualSalary?man(e.avgAnnualSalary):'—'}</td></tr>`;}).join('')}</table></div></div>`;
  // officers with career
  const off=ci.officers||[];
  if(off.length){html+=`<div class="card"><h4 class="inCard">役員一覧（${off.length}名・経歴付）</h4><div style="overflow-x:auto"><table class="data"><tr><th>役職</th><th>氏名</th><th>生年月日</th><th class="r">所有株式</th></tr>${off.map(o=>`<tr><td>${o.position||'—'}</td><td>${o.name||'—'}</td><td class="secNote">${o.birthdate||'—'}</td><td class="r num">${o.shares!=null?o.shares.toLocaleString()+'株':'—'}</td></tr>`).join('')}</table></div></div>`;}
  // major shareholders
  const sh=ci.shareholders?.majorShareholders||[];
  if(sh.length){html+=`<div class="card"><h4 class="inCard">大株主（上位${Math.min(sh.length,15)}名 / 全${sh.length}名）</h4><div style="overflow-x:auto"><table class="data"><tr><th>#</th><th>株主名</th><th class="r">所有株式(千株)</th><th class="r">比率</th></tr>${sh.slice(0,15).map((s,i)=>`<tr><td>${i+1}</td><td>${s.name}</td><td class="r num">${s.sharesThousands!=null?s.sharesThousands.toLocaleString():'—'}</td><td class="r num">${s.ratioPercent!=null?s.ratioPercent.toFixed(2)+'%':'—'}</td></tr>`).join('')}</table></div></div>`;}
  // dividends
  const div=reports.filter(r=>r.metrics&&(r.metrics.dividendPerShare!=null||r.metrics.payoutRatio!=null)).map(r=>({y:r.year,dps:r.metrics.dividendPerShare,pr:r.metrics.payoutRatio,eps:r.metrics.eps})).sort((a,b)=>b.y-a.y).slice(0,6);
  if(div.length){html+=`<div class="card"><h4 class="inCard">配当の推移</h4><div style="overflow-x:auto"><table class="data"><tr><th>年度</th><th class="r">1株配当</th><th class="r">配当性向</th><th class="r">EPS</th></tr>${div.map(d=>`<tr><td>${d.y}年度</td><td class="r num">${d.dps!=null?d.dps.toFixed(1)+'円':'—'}</td><td class="r num">${d.pr!=null?(d.pr*100>100?d.pr.toFixed(1):(d.pr).toFixed(1))+'%':'—'}</td><td class="r num">${d.eps!=null?Math.round(d.eps)+'円':'—'}</td></tr>`).join('')}</table></div></div>`;}
  return html;
}

/* ---------- COMPANY INFO ---------- */
function tabCompany(){
  const ci=DATA.companyInfo;let html='';
  if(ci.businessDescription){html+=`<div class="card"><h4 class="inCard">事業内容</h4><div style="font-size:13px;white-space:pre-wrap">${ci.businessDescription}</div></div>`;}
  const sub=ci.subsidiaries||[];
  if(sub.length){html+=`<div class="card"><h4 class="inCard">子会社・関連会社（${sub.length}社）</h4><div style="overflow-x:auto;max-height:420px"><table class="data"><tr><th>会社名</th><th>区分</th><th>所在地</th><th>事業</th><th class="r">議決権</th></tr>${sub.map(s=>`<tr><td>${s.name||'—'}</td><td>${s.category||'—'}</td><td>${s.location||'—'}</td><td>${s.business||'—'}</td><td class="r num">${s.votingRatioPercent!=null?s.votingRatioPercent.toFixed(1)+'%':'—'}</td></tr>`).join('')}</table></div></div>`;}
  const his=ci.history||[];
  if(his.length){html+=`<div class="card"><h4 class="inCard">沿革（${his.length}件・創業から）</h4><div class="tl mt16">${his.map(h=>`<div class="ev"><div class="d">${h.date||''}</div><div class="t">${h.event||''}</div></div>`).join('')}</div></div>`;}
  // full report
  const r=rep();const fr=reports.find(x=>x.fullReport&&x.fullReport.length>50)?.fullReport;
  if(fr){html+=`<div class="card"><h4 class="inCard">AI業績分析レポート（全文）</h4><div class="report">${fr.replace(/</g,'&lt;')}</div></div>`;}
  return html||'<div class="card">企業情報なし</div>';
}

/* ---------- CREDIT ---------- */
function tabCredit(){
  const r=rep();const c=r.creditStress;const m=r.metrics||{};
  let html=`<div class="card"><div class="eyebrow">CREDIT / 信用・集中度</div><div class="secTitle">事業・地域の集中とレバレッジ</div>`;
  if(c){html+=`<div class="grid g2 mt16"><div class="kpi"><div class="l">事業セグメントHHI</div><div class="v num">${c.businessSegmentHHI?.toFixed(0)||'—'}</div><div class="secNote">トップ${c.businessTopSegmentShare?.toFixed(1)}%・${c.businessSegmentCount}事業</div></div>
  <div class="kpi"><div class="l">地域セグメントHHI</div><div class="v num">${c.geographicSegmentHHI?.toFixed(0)||'—'}</div><div class="secNote">トップ${c.geographicTopSegmentShare?.toFixed(1)}%・${c.geographicSegmentCount}地域</div></div></div>`;}
  html+=`<div class="grid g3 mt16"><div class="kpi"><div class="l">自己資本比率</div><div class="v num">${pct(m.equityRatio)}</div></div><div class="kpi"><div class="l">Net Debt/EBITDA</div><div class="v num">${m.netDebtEbitda!=null?m.netDebtEbitda.toFixed(2)+'x':'—'}</div></div><div class="kpi"><div class="l">流動比率</div><div class="v num">${pct(m.currentRatio)}</div></div><div class="kpi"><div class="l">D/Eレシオ</div><div class="v num">${pct(m.debtEquityRatio)}</div></div><div class="kpi"><div class="l">手元現金ICR</div><div class="v num">${m.cashICR!=null?m.cashICR.toFixed(1)+'x':'—'}</div></div><div class="kpi"><div class="l">短期借入比率</div><div class="v num">${pct(m.shortTermDebtRatio)}</div></div></div>`;
  html+=`<div class="footNote mt16">※ PIK・実質支払利息の精緻判定は信用ストレス機能(別パイプライン)で算出。本タブは集中度+主要レバレッジ指標を表示。</div></div>`;
  return html;
}

/* ---------- VERIFY (証明書) ---------- */
function tabVerify(){
  const r=rep();const ha=DATA.hiddenAssets;const cc=ha?.confidence?.components||{};
  let html=`<div class="card"><div class="eyebrow">DATA VERIFICATION — 証明書</div><div class="secTitle">全数値の来歴と検証結果</div>
  <div class="grid g3 mt16"><div class="kpi"><div class="l">レポート抽出Confidence</div><div class="v num">${r.confidence??'—'}%</div></div><div class="kpi"><div class="l">含み資産 信頼度</div><div class="v num">${ha?.confidence?.score??'—'} (${ha?.confidence?.label||'—'})</div></div><div class="kpi"><div class="l">会計基準</div><div class="v">${r.dynamicStatements?.accountingStandard||'—'}</div></div></div>`;
  // identity check from BS
  const bs=r.financialStatements?.bs;
  if(bs){const dev=Math.abs(bs.totalAssets-(bs.totalLiabilities+bs.netAssets))/bs.totalAssets*100;
    html+=`<div class="card mt16" style="margin:0"><h4 class="inCard">財務恒等式チェック</h4><table class="data"><tr><th>項目</th><th class="r">値</th></tr><tr><td>総資産</td><td class="r num">${yen(bs.totalAssets)}</td></tr><tr><td>負債 + 純資産</td><td class="r num">${yen(bs.totalLiabilities+bs.netAssets)}</td></tr><tr><td>乖離率</td><td class="r num ${dev<0.1?'pos':'neg'}">${dev.toFixed(3)}% ${dev<0.1?'✓ 通過':''}</td></tr></table></div>`;}
  html+=`<div class="card mt16" style="margin:0"><h4 class="inCard">含み資産 Confidence 内訳</h4><table class="data"><tr><th>要素</th><th class="r">スコア</th></tr>${Object.entries(cc).map(([k,v])=>`<tr><td>${k}</td><td class="r num">${(v).toFixed(3)}</td></tr>`).join('')}</table></div>`;
  html+=`<div class="card mt16" style="margin:0"><h4 class="inCard">出典</h4><div style="font-size:13px">一次資料: <a href="https://disclosure2.edinet-fsa.go.jp/WEEK0040.aspx?docID=${r.edinetDocID}" target="_blank">EDINET 有価証券報告書（docID ${r.edinetDocID}）↗</a><br>含み資産: 国交省 地価公示(L01)・地価調査(L02)・取引価格・用途地域(A29)<br><span class="secNote">データ更新: ${r.generatedAt||'—'}</span></div></div></div>`;
  html+=`<div class="footNote">疑い深い読者こそ最良の読者です。誤りを見つけたら報告フォームから。確認のうえ誤りなら24時間以内に訂正し記録を公開します。</div>`;
  return html;
}

/* ---------- router ---------- */
function goTab(id){curTab=id;renderHead();renderPanel();window.scrollTo({top:0});}
function renderPanel(){
  const map={overview:tabOverview,hidden:tabHidden,segment:tabSegment,financial:tabFinancial,salary:tabSalary,company:tabCompany,credit:tabCredit,verify:tabVerify};
  document.getElementById('main').innerHTML=`<section class="panel on">${(map[curTab]||(()=>''))()}</section>
  <div class="footNote">これは「キンミャクコードv2」提案の企業ページUIを、${DATA.companyName}(${DATA.ticker})の<b>実データ</b>(public/data/${DATA.ticker}.json)に全項目結線した試作です。架空企業ではありません。年度ボタン・タブ・シナリオ切替すべて動作します。</div>`;
  if(curTab==='hidden')setScn(SCN_KEY);
  if(curTab==='hidden'){document.querySelectorAll('#scnBtns button').forEach(b=>b.onclick=()=>setScn(b.dataset.s));}
}
const _h=(location.hash||'').replace('#','');if(_h&&TABS.some(t=>t[0]===_h))curTab=_h;
renderHead();renderPanel();
</script>
